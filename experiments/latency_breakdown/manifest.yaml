  - name: MambaVision-batch-1024
    script: trainers/image_classification_latency.py
    config:
      model_name: "nvidia/MambaVision-T-1K" 
      data_dir: "/raid/tensio/imagenet/full/imagefolder"
      val_split: 0.1
      learning_rate: 1.0e-3
      epochs: 1
      max_steps: 99999999999
      batch_size: 1024
      prefetch_factor: Null
      workers: 0
      output_dir: "/raid/datasets/ILSVRC/imagenet-1k/checkpoints"

  # Domain: Natural Language Processing

  - name: Llama-3.2-1B-batch-32
    script: trainers/llm_finetune_latency.py
    config:
      model_name: meta-llama/Llama-3.2-1B
      dataset_name: tatsu-lab/alpaca
      data_dir: null
      output_dir: /raid/datasets/tatsu-lab/alpaca/checkpoints
      cache_dir: /raid/datasets/tatsu-lab/alpaca/
      max_steps: 99999999999
      max_samples: null      
      batch_size: 32
      epochs: 1
      lr: 2.0e-6
      warmup_steps: 0
      max_seq_length: 512
      save_steps: 0
      save_model: false
      pin_memory: true
      workers: 0
      streaming: false
      torch_compile: false
  - name: Llama-3.2-3B-batch-16

  - name: ImageNet-batch-1024-train-workers-8-jpg-mem-100GB-swap-135GB
    script: trainers/image_classification_throughput.py
    memory_limit_gb: 100
    config:
      model_name: "microsoft/resnet-50"
      data_dir: "/raid/datasets/imagenet-1k/jpg"
      epochs: 1
      batch_size: 1024
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: true
      num_batches: -1  
      mode: "train" 
      num_workers: [8]
      channels_last: true


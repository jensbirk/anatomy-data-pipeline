  runs:
  - name: ResNet-batch-1024-preprocess-workers-0
    script: trainers/image_classification_throughput.py
    config:
      model_name: "microsoft/resnet-50"
      data_dir: "/raid/datasets/imagenet-1k/jpg"
      dataset_type: "jpeg"
      epochs: 1
      batch_size: 1024
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: true
      num_batches: -1  # -1 means all batches
      mode: "preprocess"
      num_workers: [0]
      output_dir: "/raid/datasets/ILSVRC/imagenet-1k/checkpoints" 

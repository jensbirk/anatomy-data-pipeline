runs:
    # Qwen3-1.7B
  - name: Qwen3-1.7B-batch-32-disk-workers-0
    script: trainers/pretrain.py
    config:
      model_name: Qwen/Qwen3-1.7B
      data_dir: /raid/datasets/c4/converted/arrow
      output_dir: /raid/datasets/tatsu-lab/alpaca/checkpoints
      cache_dir: /raid/datasets/c4/converted/arrow
      max_samples: null      
      batch_size: 32
      prefetch_factor: 2
      num_batches: -1  # -1 means all batches
      num_workers: [0]
      mode: "disk" 
      epochs: 1
      lr: 2.0e-6
      warmup_steps: 0
      max_seq_length: 512
      save_steps: 0
      save_model: false
      pin_memory: true
      streaming: false
      torch_compile: false
      on_the_fly_tokenization: true

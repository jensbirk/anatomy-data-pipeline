runs:
  - name: Whisper-small-batch-64-disk-workers-0
    script: trainers/speech_throughput.py
    config:
      model_name: openai/whisper-small
      dataset_type: flac
      dataset_root: /raid/datasets/librispeech/flac
      audio_column: audio
      text_column: text
      language: english
      cache_dir: /raid/datasets/openslr
      output_dir: /raid/datasets/openslr/checkpoints
      batch_size: 64
      epochs: 1
      max_steps: -1
      lr: 1.0e-5
      seed: 42
      freeze_encoder: false
      save_model: false
      mode: "disk"
      num_batches: -1
      prefetch_factor: 2
      num_workers: [0]

runs:
  - name: Whisper-small-batch-64-decode-workers-0-mp3
    script: trainers/speech_throughput.py
    config:
      model_name: openai/whisper-small
      dataset_name: librispeech_asr
      dataset_config: clean
      train_split: "decode.100"
      eval_split: "test"
      audio_column: audio
      text_column: text
      language: english
      dataset_root: /raid/datasets/librispeech/mp3
      dataset_type: "mp3"
      sampling_rate: 16000
      batch_size: 64
      epochs: 1
      max_steps: 10
      lr: 1.0e-5
      seed: 42
      freeze_encoder: false
      save_model: false
      mode: "decode"
      num_batches: -1
      prefetch_factor: 2
      num_workers: [0]

# Checkpoint cost on NFS.
# Run on Machine 2 (DTU P1, LSF: bsub < experiments/checkpoint_cost_nfs/submit.lsf)
runs:
- name: ResNet-50-nockpt-r1
  script: trainers/image_classification_throughput.py
  config:
    dataset_name: imagenet-1k
    data_dir: /dtu/p1/jebian/data/train/
    output_dir: /dtu/p1/jebian/checkpoints/imagenet
    epochs: 1
    mode: train
    num_batches: 120
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: true
    model_name: microsoft/resnet-50
    batch_size: 1024
    max_steps: 120
    save_steps: 0
    checkpoint_timing: true
    timing_warmup_steps: 20
    async_checkpoint: false

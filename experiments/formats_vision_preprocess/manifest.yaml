runs:
### PNG
  - name: ImageNet-batch-1024-preprocess-workers-0-png
    script: trainers/image_classification_throughput.py
    config:
      model_name: "microsoft/resnet-50"
      data_dir: "/raid/datasets/imagenet-1k/png"
      epochs: 1
      batch_size: 1024
      persistent_workers: false
      pin_memory: true
      num_batches: -1  
      mode: "preprocess" 
      num_workers: [0]
      output_dir: "/raid/datasets/ILSVRC/imagenet-1k/checkpoints"

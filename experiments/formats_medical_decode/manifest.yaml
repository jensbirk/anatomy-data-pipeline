runs: 
  - name: 3D-UNet-batch-32-decode-workers-0-nii
    script: trainers/medical_segmentation_throughput.py
    config:
      model: "UNet"
      task: "Task01_BrainTumour"
      batch_size: 32
      epochs: 1
      num_batches: -1
      num_workers: [0]
      mode: "decode"
      cache_dir: "/raid/datasets/brats/nii"

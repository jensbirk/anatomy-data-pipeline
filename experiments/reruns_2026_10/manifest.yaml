# Speech +Transfer for Fig. 8, and 3D-UNet NIfTI vs NIfTI-GZ (3 reps,
# 16 workers) for Table 6 / Section 4.3. Run on Machine 1:
#   make run experiments/reruns_2026_10
runs:
- name: Whisper-small-batch-64-transfer-workers-0
  script: trainers/speech_throughput.py
  config:
    audio_column: audio
    batch_size: 64
    cache_dir: /raid/datasets/openslr
    dataset_root: /raid/datasets/librispeech/flac
    dataset_type: flac
    epochs: 1
    freeze_encoder: false
    language: english
    lr: 1.0e-05
    max_steps: -1
    mode: transfer
    model_name: openai/whisper-small
    num_batches: -1
    num_workers:
    - 0
    output_dir: /raid/datasets/openslr/checkpoints
    prefetch_factor: 2
    save_model: false
    seed: 42
    text_column: text
